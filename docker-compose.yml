services:
  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - orbit-mongo:/data/db
    restart: unless-stopped
volumes:
  orbit-mongo:
